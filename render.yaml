services:
  - type: web
    name: baby-lobster-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-3000}
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PORT
        value: "3000"
      - key: TTS_VOICE
        value: en-US-JennyNeural
      - key: MAX_HISTORY
        value: "10"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
